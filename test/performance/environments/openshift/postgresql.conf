# Fixed PostgreSQL tuning for reproducible tier-2 benchmarks (ephemeral OpenShift).
#
# Same role as the tier-1 file, sized up for a 5-10 GB dataset on a dedicated node.
# It is the single source of truth for database configuration during a tier-2 run
# and is loaded via conf.d/override.conf (see postgres-patch.yaml).
#
# Keep these values version-controlled and stable: changing them changes results,
# so a change should be treated like a dataset-version bump and noted in the
# report/baseline metadata.

# Memory — assumes a dedicated node with ~8 GB available to Postgres.
shared_buffers = 2GB
work_mem = 32MB
maintenance_work_mem = 512MB
effective_cache_size = 6GB

# Write-ahead log — sized for sustained tier-2 ingest without excessive checkpointing.
wal_buffers = 64MB
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9

# Planner — assume SSD-backed storage.
random_page_cost = 1.1
effective_io_concurrency = 200

# Parallelism — let large label/index scans use multiple workers.
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# Connections — match the higher tier-2 harness concurrency with headroom.
max_connections = 200

# Deterministic autovacuum so background work does not skew back-to-back runs.
autovacuum = on
autovacuum_naptime = 10s
